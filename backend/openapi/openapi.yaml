openapi: 3.0.3
info:
  title: しろかぎ Backend API
  description: |
    「しろかぎ」のセキュリティ実験場向け Go API（PoC）。
    CSV 仮想 DB からメッセージを取得して返すほか、
    HTML 埋め込み時のエスケープ（反射型 XSS 防止）を示すエンドポイントを含む。
    OS コマンドインジェクション実験用の ping エンドポイントを含む（教育・UT 用）。
    ブラウザ（frontend）からの呼び出し向けに CORS を付与する。
    許可オリジンは環境変数 `CORS_ALLOWED_ORIGINS`（カンマ区切り）。未設定時は
    `http://localhost:3000` と `http://127.0.0.1:3000`。
  version: 0.0.4
  contact:
    name: WhiteKey Experimentation Site

servers:
  - url: http://localhost:8080
    description: ローカル（Docker Compose）
  - url: /
    description: デプロイ先（相対）

tags:
  - name: message
    description: 表示メッセージ
  - name: experiment
    description: セキュリティ実験・教育用エンドポイント

paths:
  /:
    get:
      tags:
        - message
      operationId: getRootMessage
      summary: 既定メッセージを取得する
      description: |
        CSV に登録された既定メッセージ（id=`1`）を JSON で返す。
      responses:
        "200":
          description: メッセージ取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              examples:
                helloWorld:
                  value:
                    message: Hello World
        "405":
          description: 許可されていない HTTP メソッド
          content:
            text/plain:
              schema:
                type: string
                example: method not allowed
        "500":
          description: 内部エラー（詳細はクライアントへ露出しない）
          content:
            text/plain:
              schema:
                type: string
                example: internal server error

  /experiment/greet:
    get:
      tags:
        - experiment
      operationId: getExperimentGreet
      summary: 名前を埋め込んだ HTML 挨拶を返す
      description: |
        クエリ `name` を HTML 断片へ埋め込む。
        埋め込み前に `html.EscapeString` 相当のエスケープを行い、反射型 XSS を防ぐ。
        セキュリティ実験・ユニットテストの題材としても利用する。
      parameters:
        - name: name
          in: query
          required: false
          description: 挨拶に埋め込む表示名（HTML 特殊文字はエスケープされる）
          schema:
            type: string
          examples:
            plain:
              summary: 平文
              value: しろかぎ
            scriptProbe:
              summary: XSS プローブ（レスポンスではエスケープされる）
              value: <script>alert(1)</script>
      responses:
        "200":
          description: HTML 挨拶の返却成功
          content:
            text/html:
              schema:
                type: string
                description: UTF-8 の HTML 断片
              examples:
                plain:
                  summary: 平文
                  value: "<h1>Hello, しろかぎ</h1>"
                escaped:
                  summary: エスケープ済み
                  value: "<h1>Hello, &lt;script&gt;alert(1)&lt;/script&gt;</h1>"
        "405":
          description: 許可されていない HTTP メソッド
          content:
            text/plain:
              schema:
                type: string
                example: method not allowed

  /experiment/ping:
    get:
      tags:
        - experiment
      operationId: getExperimentPing
      summary: host から ping コマンドを組み立てて実行する（実験）
      description: |
        クエリ `host` から ping 用 argv を組み立てて実行する。
        **意図的に不安全**（シェル連結）。教育・ユニットテスト用。本番公開しないこと。
      parameters:
        - name: host
          in: query
          required: true
          description: ping 対象（実験では未検証のままシェルへ連結されうる）
          schema:
            type: string
          example: example.com
      responses:
        "200":
          description: 組み立て結果と実行出力
          content:
            application/json:
              schema:
                type: object
                required: [host, args, warning]
                properties:
                  host:
                    type: string
                  args:
                    type: array
                    items:
                      type: string
                  output:
                    type: string
                  warning:
                    type: string
        "400":
          description: host 未指定など
        "405":
          description: 許可されていない HTTP メソッド

components:
  schemas:
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: 表示用メッセージ本文
          example: Hello World
