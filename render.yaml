# Render Blueprint — しろかぎ実験場
# DATABASE_URL は手貼りせず fromDatabase で注入する。
# Free Postgres は約 30 日で期限切れ。作り直し時も name / region は変えない。
# 詳細: docs/render.md

databases:
  - name: whitekey-db
    plan: free
    region: oregon
    databaseName: whitekey
    user: whitekey
    ipAllowList: [] # private network only

services:
  - type: web
    name: whitekey-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: "off"
    healthCheckPath: /
    envVars:
      - key: ADDR
        value: ":8080"
      - key: DATABASE_URL
        fromDatabase:
          name: whitekey-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: whitekey-frontend
    runtime: docker
    plan: free
    region: oregon
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: API_BASE_URL
        sync: false
