name: Backend Verify

on:
  # feature / experiment は PR のみ。push は main だけにし、PR 時の二重起動を防ぐ。
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-verify.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-verify.yml"

concurrency:
  group: backend-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test, Scan, Syft SBOM, Grype Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Postgres with ephemeral password
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          PW="$(openssl rand -hex 16)"
          {
            echo "POSTGRES_USER=ci"
            echo "POSTGRES_DB=whitekey"
            echo "POSTGRES_PASSWORD=${PW}"
            echo "TEST_DATABASE_URL=postgres://ci:${PW}@localhost:5432/whitekey?sslmode=disable"
          } >> "${GITHUB_ENV}"
          docker run -d --name backend-verify-pg \
            -e POSTGRES_USER=ci \
            -e "POSTGRES_PASSWORD=${PW}" \
            -e POSTGRES_DB=whitekey \
            -p 5432:5432 \
            postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec backend-verify-pg pg_isready -U ci -d whitekey >/dev/null 2>&1; then
              echo "Postgres is ready (attempt ${i})"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres failed to become ready"
          docker logs backend-verify-pg || true
          exit 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: backend
          args: --timeout=5m

      - name: Run tests
        # -p 1: 同一 TEST_DATABASE_URL を触る integration / persistence のパッケージ並列を防ぐ
        run: go test -p 1 -v -coverprofile=coverage.out ./...

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-coverage
          path: backend/coverage.out
          if-no-files-found: warn
          retention-days: 14

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
          output: backend-trivy-fs.txt
          ignore-unfixed: true

      - name: Upload Trivy filesystem report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-trivy-fs
          path: backend-trivy-fs.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Generate SBOM with Syft (CycloneDX)
        uses: anchore/sbom-action@v0.24.3
        with:
          path: backend
          format: cyclonedx-json
          output-file: backend-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Audit SBOM with Grype
        uses: anchore/scan-action@v7.4.2
        with:
          sbom: backend-sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: table
          output-file: backend-grype-sbom.txt

      - name: Upload Syft SBOM and Grype audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom-audit
          path: |
            backend-sbom.cdx.json
            backend-grype-sbom.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Postgres
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker rm -f backend-verify-pg || true
