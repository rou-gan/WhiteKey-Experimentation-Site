name: Backend Verify

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-verify.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "experiment/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-verify.yml"

concurrency:
  group: backend-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test, Scan, Syft SBOM, Grype Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # EXPERIMENT: intentionally old Go for Trivy failure testing.
          go-version: "1.18"
          cache-dependency-path: backend/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Keep lint compatible with Go 1.18 for this experiment branch.
          version: v1.55.2
          working-directory: backend
          args: --timeout=5m

      - name: Run tests
        run: go test -v -coverprofile=coverage.out ./...

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-coverage
          path: backend/coverage.out
          if-no-files-found: warn
          retention-days: 14

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
          output: backend-trivy-fs.txt
          ignore-unfixed: true

      - name: Upload Trivy filesystem report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-trivy-fs
          path: backend-trivy-fs.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Generate SBOM with Syft (CycloneDX)
        uses: anchore/sbom-action@v0.24.3
        with:
          path: backend
          format: cyclonedx-json
          output-file: backend-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Audit SBOM with Grype
        uses: anchore/scan-action@v7.4.2
        with:
          sbom: backend-sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          output-format: table
          output-file: backend-grype-sbom.txt

      - name: Upload Syft SBOM and Grype audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom-audit
          path: |
            backend-sbom.cdx.json
            backend-grype-sbom.txt
          if-no-files-found: warn
          retention-days: 14
