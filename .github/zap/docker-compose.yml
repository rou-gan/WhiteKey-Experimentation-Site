# CI 用: ZAP DAST ジョブ内で backend / frontend を同一ネットワークで起動する。
# ローカル用の backend/docker-compose.yml / frontend/docker-compose.yml とは分離。
# DB 資格情報は ${VAR} 参照。CI では zap-dast.yml の env で渡す（.env 不要）。
name: whitekey-zap

networks:
  zapnet:
    name: zapnet

services:
  db:
    image: postgres:16-alpine
    networks:
      - zapnet
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: whitekey-api:zap
    networks:
      - zapnet
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL}
      CORS_ALLOWED_ORIGINS: "http://frontend:3000,http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: whitekey-web:zap
    networks:
      - zapnet
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://api:8080
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      - api
